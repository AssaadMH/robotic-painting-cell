# No hardware: trajectories are planned and recorded, then replayed by play_paint.
# A placeholder controller keeps MoveIt's execution manager happy; it is never used.
moveit_manage_controllers: false
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
    - arm_controller
  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint_a1, joint_a2, joint_a3, joint_a4, joint_a5, joint_a6]
